name: Docker Image Scan

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scan image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: "registry.k8s.io/sig-storage/nfs-provisioner:v4.0.8"
          fail-build: false
          output-format: table
          output-file: grype-results.txt

      - name: Write results to job summary
        run: |
          {
            echo '## NFS Provisioner image scan'
            echo '```'
            cat grype-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
